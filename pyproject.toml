[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-classical-benchmark"
version = "0.1.0"
description = "A fair, reproducible benchmark of classical, quantum, and quantum-inspired optimizers on TSP under a matched wall-clock budget."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dheeraj Lagudu", email = "dheerajram12262@gmail.com" }]
keywords = ["quantum-computing", "qaoa", "qubo", "optimization", "tsp", "benchmarking"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Real quantum path: QAOA on a statevector simulator (small instances only).
quantum = [
  "qiskit>=1.0",
  "scipy>=1.11",
]
# Strong classical baseline.
ortools = [
  "ortools>=9.7",
]
# Optional quantum annealer (D-Wave); requires credentials to actually run.
annealer = [
  "dwave-ocean-sdk>=6.8",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "black>=24.0",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
  "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/DheerajRam12262/quantum-classical-benchmark"

[project.scripts]
qcb-generate = "quantum_classical_benchmark.problems.tsp_cli:main"
qcb-encode-qubo = "quantum_classical_benchmark.encoding.qubo:main"
qcb-sa = "quantum_classical_benchmark.solvers.simulated_annealing:main"
qcb-quantum-inspired = "quantum_classical_benchmark.solvers.quantum_inspired:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/quantum_classical_benchmark"]
